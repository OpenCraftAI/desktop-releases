name: Update latest.json

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-id:
        description: "Release ID (from the release URL)"
        required: true
        type: string

jobs:
  update-latest-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate latest.json from release assets
        run: |
          RELEASE_ID="${{ github.event.release.id || inputs.release-id }}"
          echo "Using release ID: $RELEASE_ID"
          RELEASE_DATA=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --jq '{
            version: .tag_name,
            publishedAt: .published_at,
            assets: [.assets[] | {
              platform: (if (.name | test("[.]exe$"; "i")) then "windows"
                        elif (.name | test("[.]dmg$"; "i")) then "macos"
                        elif (.name | test("[.](?:AppImage|deb|rpm)$"; "i")) then "linux"
                        else null end),
              name: .name,
              url: .browser_download_url,
              size: .size
            } | select(.platform != null)]
          }')
          echo "$RELEASE_DATA" > latest.json
          echo "Generated latest.json for release $RELEASE_ID"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit and push latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "chore: update latest.json"
          git push origin HEAD:main
